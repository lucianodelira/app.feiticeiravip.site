<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeiticeiraVIP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(to bottom, #000, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 20px;
      color: white;
      font-size: 1.2em;
      opacity: 0.8;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    iframe {
      display: none;
      border: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Carregando FeiticeiraVIP...</div>
  </div>

  <iframe
    id="mainIframe"
    src="https://app.feiticeira.club/pr/PRBJ9rmd"
    title="Feiticeira.VIP"
    allow="clipboard-read; clipboard-write"
  
    onload="document.getElementById('loading').style.display='none'; this.style.display='block';"
  ></iframe>



<!-- BANNER WHATSAPP - GRUPO DE PALPITES -->
<!-- ========================================= -->
<div id="whats-banner" style="display: none;">
  <!-- BOTÃO FECHAR -->
  <button
    onclick="fecharWhatsBanner()"
    class="whats-fechar"
    aria-label="Fechar banner"
  >
    ×
  </button>

  <!-- ÍCONE WHATSAPP -->
  <div class="whats-icon-top">
    <img
      src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
      alt="WhatsApp"
    >
  </div>

  <!-- TÍTULO -->
  <h2>🔥 ENTRE NO GRUPO DE PALPITES!</h2>
  <p>
    Receba palpites, informações e novidades<br>
    diretamente no seu WhatsApp.
  </p>

  <!-- BOTÃO WHATSAPP -->
  <a
    href="https://chat.whatsapp.com/BiiU4p1jYXIFUF1ybsZQr5"
    target="_blank"
    rel="noopener noreferrer"
    onclick="fecharWhatsBanner()"
    class="whats-button"
  >
    <img
      src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
      alt="WhatsApp"
    >
    <span>
      PARTICIPAR DO GRUPO
    </span>
  </a>

  <!-- RODAPÉ -->
  <div class="whats-rodape">
    ✅ Grupo gratuito • Entre agora!
  </div>
</div>

<style>
/* ========================================= */
/* BANNER */
/* ========================================= */
#whats-banner {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 380px;
  max-width: calc(100% - 30px);
  padding: 35px 25px 28px;
  background:
    radial-gradient(
      circle at top,
      #123c28 0%,
      #111 45%,
      #080808 100%
    );
  border: 2px solid #25D366;
  border-radius: 22px;
  text-align: center;
  font-family: Arial, sans-serif;
  z-index: 999999;
  box-shadow:
    0 0 15px rgba(37,211,102,.7),
    0 0 40px rgba(37,211,102,.4),
    0 15px 50px rgba(0,0,0,.8);
  animation:
    bannerEntrada .5s ease,
    bannerBrilho 2s infinite;
}

/* ========================================= */
/* ANIMAÇÃO DE ENTRADA */
/* ========================================= */
@keyframes bannerEntrada {
  from {
    opacity: 0;
    transform:
      translate(-50%, -45%)
      scale(.8);
  }
  to {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
  }
}

/* ========================================= */
/* ANIMAÇÃO DE BRILHO */
/* ========================================= */
@keyframes bannerBrilho {
  0%, 100% {
    box-shadow:
      0 0 15px rgba(37,211,102,.6),
      0 0 40px rgba(37,211,102,.3),
      0 15px 50px rgba(0,0,0,.8);
  }
  50% {
    box-shadow:
      0 0 25px rgba(37,211,102,1),
      0 0 60px rgba(37,211,102,.55),
      0 15px 50px rgba(0,0,0,.8);
  }
}

/* ========================================= */
/* BOTÃO FECHAR */
/* ========================================= */
.whats-fechar {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 35px;
  height: 35px;
  border: 0;
  border-radius: 50%;
  background: #ff1744;
  color: #fff;
  font-size: 25px;
  font-weight: bold;
  line-height: 35px;
  cursor: pointer;
  box-shadow:
    0 0 12px rgba(255,23,68,.6);
  transition: .2s;
}

.whats-fechar:hover {
  transform: scale(1.12);
  background: #ff0033;
}

/* ========================================= */
/* ÍCONE SUPERIOR */
/* ========================================= */
.whats-icon-top {
  width: 75px;
  height: 75px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: #25D366;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 15px #25D366,
    0 0 35px rgba(37,211,102,.6);
  animation: iconPulse 1.5s infinite;
}

.whats-icon-top img {
  width: 48px;
  height: 48px;
}

/* ========================================= */
/* PULSO DO ÍCONE */
/* ========================================= */
@keyframes iconPulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.08);
  }
}

/* ========================================= */
/* TÍTULO */
/* ========================================= */
#whats-banner h2 {
  margin: 8px 0 10px;
  color: #25D366;
  font-size: 23px;
  font-weight: 900;
  font-family: Arial, sans-serif;
  text-shadow:
    0 0 8px rgba(37,211,102,.8);
}

/* ========================================= */
/* TEXTO */
/* ========================================= */
#whats-banner p {
  margin: 0;
  color: #ddd;
  font-size: 14px;
  line-height: 1.5;
}

/* ========================================= */
/* BOTÃO WHATSAPP */
/* ========================================= */
.whats-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  box-sizing: border-box;
  margin-top: 20px;
  padding: 16px 15px;
  background:
    linear-gradient(
      45deg,
      #00c853,
      #25D366,
      #00e676
    );
  color: #fff;
  border-radius: 14px;
  text-decoration: none;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: .3px;
  box-shadow:
    0 5px 20px rgba(37,211,102,.5);
  animation: buttonPulse 1.8s infinite;
  transition: .2s;
}

.whats-button img {
  width: 30px;
  height: 30px;
}

.whats-button:hover {
  transform: scale(1.04);
  box-shadow:
    0 0 20px rgba(37,211,102,1),
    0 0 40px rgba(37,211,102,.5);
}

/* ========================================= */
/* PULSO DO BOTÃO */
/* ========================================= */
@keyframes buttonPulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.025);
  }
}

/* ========================================= */
/* RODAPÉ */
/* ========================================= */
.whats-rodape {
  margin-top: 14px;
  color: #25D366;
  font-size: 12px;
  font-weight: bold;
}

/* ========================================= */
/* CELULAR */
/* ========================================= */
@media (max-width: 480px) {
  #whats-banner {
    width: 330px;
    padding: 30px 20px 23px;
  }

  #whats-banner h2 {
    font-size: 20px;
  }

  #whats-banner p {
    font-size: 13px;
  }

  .whats-button {
    font-size: 15px;
    padding: 15px 10px;
  }
}

/* ========================================= */
/* ANIMAÇÃO DE SAÍDA */
/* ========================================= */
.whats-banner-fechando {
  opacity: 0 !important;
  transform:
    translate(-50%, -50%)
    scale(.8) !important;
  transition: .25s ease;
}
</style>

<script>
/* ========================================= */
/* CONTROLE DE EXIBIÇÃO (1x por dia) */
/* ========================================= */
function deveMostrarBanner() {
  const hoje = new Date().toDateString(); // Ex: "Sat Aug 08 2026"
  const ultimaExibicao = localStorage.getItem('whatsBannerUltimaExibicao');

  // Se já mostrou hoje, não mostra novamente
  if (ultimaExibicao === hoje) {
    return false;
  }
  return true;
}

function marcarBannerComoExibido() {
  const hoje = new Date().toDateString();
  localStorage.setItem('whatsBannerUltimaExibicao', hoje);
}

/* ========================================= */
/* FECHAR BANNER */
/* ========================================= */
function fecharWhatsBanner() {
  const banner = document.getElementById("whats-banner");
  if (!banner) return;

  // Marca que o usuário já viu o banner hoje
  marcarBannerComoExibido();

  banner.classList.add("whats-banner-fechando");

  setTimeout(function () {
    banner.remove();
  }, 250);
}

/* ========================================= */
/* INICIALIZAÇÃO */
/* ========================================= */
document.addEventListener('DOMContentLoaded', function () {
  const banner = document.getElementById("whats-banner");

  if (!banner) return;

  // Verifica se deve mostrar
  if (deveMostrarBanner()) {
    banner.style.display = "block"; // Mostra o banner
    // Opcional: marcar já na exibição (descomente se preferir)
    // marcarBannerComoExibido();
  } else {
    banner.remove(); // Remove completamente se já mostrou hoje
  }
});
</script>
  
</body>
</html>
